[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachproof"
version = "0.1.0"
description = "Evidence-backed EU CRA Article 14 decisions: is a known-exploited vulnerability reachable in your product?"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
reachproof = "reachproof.cli:main"

[tool.setuptools.packages.find]
include = ["reachproof*"]

[tool.setuptools.package-data]
reachproof = ["signatures/*.json"]
