name: llm-eval
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model (blank = gemini-3.5-flash-lite)"
        required: false
        default: ""
  pull_request:

permissions:
  contents: read

concurrency:
  group: llm-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Free tier: gemini-2.5-flash is closed to new users and gemini-3.8-flash allows 20 requests/day.
      MODEL: ${{ inputs.model || vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore LLM response cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: llm-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: llm-cache-
      - name: List available Gemini flash models
        if: env.GEMINI_API_KEY != ''
        run: |
          curl -sf -H "x-goog-api-key: $GEMINI_API_KEY"             "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000"             | python -c "import json,sys; [print(m['name'].split('/')[-1]) for m in json.load(sys.stdin).get('models',[]) if 'flash' in m['name'] and 'generateContent' in m.get('supportedGenerationMethods',[])]"             || echo "Could not list models"
      - name: Run evaluation with Gemini
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=LLM run skipped::GEMINI_API_KEY secret is not set. Add it with: gh secret set GEMINI_API_KEY -R ${{ github.repository }}"
            echo "GEMINI_API_KEY is not set: skipping the LLM evaluation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Model: $MODEL"
          LLM=gemini ./scripts/run_all.sh
      - name: Fail if any LLM call errored
        if: env.GEMINI_API_KEY != ''
        run: |
          python - <<'PY'
          import collections, glob, json, sys
          def errors(o):
              if isinstance(o, dict):
                  if o.get("error"): yield o["error"]
                  for v in o.values(): yield from errors(v)
              elif isinstance(o, list):
                  for v in o: yield from errors(v)
          found = collections.Counter()
          for f in glob.glob("results/*/assessment.json"):
              for e in errors(json.load(open(f))): found[e.split(":")[0] + ": " + e.split(":", 2)[-1].strip()[:120]] += 1
          if found:
              for msg, n in found.items(): print(f"::error title=LLM call failed ({n}x)::{msg}")
              print("LLM results are incomplete: the numbers above are not a valid evaluation.")
              sys.exit(1)
          print("All LLM calls succeeded.")
          PY
      - name: Save LLM response cache
        if: always() && env.GEMINI_API_KEY != ''
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: llm-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload results
        if: always() && env.GEMINI_API_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: llm-eval-results
          path: results/
          if-no-files-found: warn
